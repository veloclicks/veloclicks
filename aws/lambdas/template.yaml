AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# Secrets are passed in as NoEcho parameters, resolved from SSM at deploy time
# (see deploy command) rather than via {{resolve:ssm-secure:...}} — CloudFormation
# does not support secure SSM dynamic references in Lambda Environment Variables.

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  DatabaseUrl:
    Type: String
    NoEcho: true
  SecretKey:
    Type: String
    NoEcho: true

Globals:
  Api:
    AccessLogSetting:
      DestinationArn: !GetAtt ApiAccessLogs.Arn
      Format: '{"request_id":"$context.requestId","integration_request_id":"$context.integration.requestId","request_time_epoch":"$context.requestTimeEpoch","method":"$context.httpMethod","status":"$context.status","response_latency_ms":"$context.responseLatency","integration_latency_ms":"$context.integrationLatency","response_bytes":"$context.responseLength"}'

Resources:
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/veloclicks-auth-access
      RetentionInDays: 7

  CoachFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: veloclicks-coach
      CodeUri: coach/
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 55
      MemorySize: 512
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          LLM_MODEL: claude-sonnet-5

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: veloclicks-auth
      CodeUri: auth/
      # Match the live entry point so updates and rollbacks can swap code alone.
      Handler: handler.handler
      Runtime: python3.11
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          SECRET_KEY: !Ref SecretKey
      Events:
        Login:
          Type: Api
          Properties:
            Path: /api/login
            Method: post
        Register:
          Type: Api
          Properties:
            Path: /api/register
            Method: post
        Refresh:
          Type: Api
          Properties:
            Path: /api/refresh
            Method: post
        Options:
          Type: Api
          Properties:
            Path: /api/{proxy+}
            Method: options

Outputs:
  AuthApiUrl:
    Description: Invoke URL for the auth API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
