AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Standalone paginated Activities API

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
  SecretKey:
    Type: String
    NoEcho: true
  CorsOrigin:
    Description: Comma-separated frontend origins allowed by the Activities API
    Type: String
    Default: 'http://localhost:3000'

Globals:
  Api:
    AccessLogSetting:
      DestinationArn: !GetAtt ApiAccessLogs.Arn
      Format: '{"request_id":"$context.requestId","integration_request_id":"$context.integration.requestId","request_time_epoch":"$context.requestTimeEpoch","method":"$context.httpMethod","status":"$context.status","response_latency_ms":"$context.responseLatency","integration_latency_ms":"$context.integrationLatency","response_bytes":"$context.responseLength"}'

Resources:
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/veloclicks-activities-access
      RetentionInDays: 7

  ActivitiesPrototype:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: activities/
      Handler: handler.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          SECRET_KEY: !Ref SecretKey
          CORS_ORIGIN: !Ref CorsOrigin
      Events:
        List:
          Type: Api
          Properties:
            Path: /strava/activities/
            Method: get
        Preflight:
          Type: Api
          Properties:
            Path: /strava/activities/
            Method: options

Outputs:
  ActivitiesApiUrl:
    Description: Base URL for the paginated Activities API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
