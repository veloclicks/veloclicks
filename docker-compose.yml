services:
  db:
    container_name: vc_postrgres
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  flask:
    container_name: vc_flask
    build: ./flask
    ports:
      - "5002:5000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: ""
      FLASK_APP: app:application
      FRONTEND_URL: http://localhost:3000
      LOCAL_DOMAIN_SERVICES: "1"
      ACTIVITY_SNAPSHOT_DIRECTORY: /snapshots
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:5000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./flask:/app
      - activity_snapshots:/snapshots
    restart: unless-stopped

  activities-worker:
    build: ./flask
    entrypoint: ["flask", "--app", "app:application", "activities-worker", "--watch"]
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PYTHONPATH: /app
      LOG_LEVEL: INFO
      ACTIVITY_SNAPSHOT_DIRECTORY: /snapshots
    depends_on:
      flask:
        condition: service_healthy
    volumes:
      - ./flask:/app
      - activity_snapshots:/snapshots
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5002
      NEXT_PUBLIC_PROGRESSIVE_ACTIVITY_SYNC: "1"
      NEXT_PUBLIC_AUTH_URL: http://localhost:5002/auth
      NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
    depends_on:
      flask:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  activity_snapshots:
